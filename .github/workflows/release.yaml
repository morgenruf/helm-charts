name: Release Helm Chart

on:
  push:
    branches: [main]
  # Picks up a new chart version from morgenruf/morgenruf without a manual
  # trigger. Runs that find nothing new stop at the version check below.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A published version must never be packaged again: a second package
      # of the same version gets a new digest and breaks pinned installs.
      - name: Check for a new chart version
        id: version
        run: |
          git clone --depth 1 https://github.com/morgenruf/morgenruf.git /tmp/morgenruf-src
          version=$(awk '/^version:/ {print $2}' /tmp/morgenruf-src/app/helm/morgenruf/Chart.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -f "charts/morgenruf-$version.tgz" ]; then
            echo "Chart $version is already published."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing chart $version."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.version.outputs.new == 'true'
        uses: azure/setup-helm@v5

      # The chart has no subchart dependencies since morgenruf/morgenruf#131:
      # the bundled PostgreSQL is a StatefulSet in the chart itself, because
      # Bitnami withdrew the images their subchart pulled. Nothing here needs
      # a third-party chart repository to be reachable any more.
      - name: Package the chart
        if: steps.version.outputs.new == 'true'
        run: |
          helm package /tmp/morgenruf-src/app/helm/morgenruf --destination ./charts

      - name: Generate index.yaml
        if: steps.version.outputs.new == 'true'
        run: |
          helm repo index ./charts --url https://charts.morgenruf.dev/charts
          cp ./charts/index.yaml ./index.yaml

      - name: Commit and push
        if: steps.version.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update helm chart index [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        if: steps.version.outputs.new == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          cname: charts.morgenruf.dev

      - name: Push to GHCR OCI
        if: steps.version.outputs.new == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin
          helm push "./charts/morgenruf-${{ steps.version.outputs.version }}.tgz" oci://ghcr.io/morgenruf/charts
