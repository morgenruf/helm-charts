version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: helm
    directory: /morgenruf
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A Postgres major version cannot start on the previous major's data
      # directory, so helm upgrade would break every existing install. Major
      # upgrades are planned by hand with a dump and restore path.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
